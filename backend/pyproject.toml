[project]
name = "chat-with-documents"
version = "0.1.0"
description = "Local document chat backend with grounded RAG and streaming citations"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "faiss-cpu>=1.15.1",
    "fastapi>=0.143.0",
    "langchain-google-genai>=4.4.1",
    "langchain-ollama>=1.1.0",
    "langchain-openai>=1.7.1",
    "langchain-text-splitters>=1.1.3",
    "numpy>=2.5.4",
    "portalocker>=4.4.0",
    "pydantic-settings>=2.15.0",
    "pymupdf>=1.28.2",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.1.4",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
